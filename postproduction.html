    <h3>Typography Project</h3>
    <figure class="wide-figure">
      <video class="panel-video" controls preload="metadata" playsinline>
        <source src="images/videos/final.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
      <figcaption>In this college project, we were tasked to choose a song to overlay onto any media we wanted to convey a message. We had to incorporate the lyrics onto the screen, but instead of just writing it on the bottom like subtitles we were asked to blend the text into the environment via colour matching and using Adobe After Effects to isolate the subject so that the text could weave in front of or behind the subject itself.</figcaption>
    </figure>
  </section>

  <section class="panel">
    <h3>Audio Mixing Project</h3>
    <figure class="wide-figure">
      <video class="panel-video" controls preload="metadata" playsinline>
        <source src="images/videos/project3.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
      <figcaption>In this college project, we were tasked to choose a monologue from a film and overlay it onto the music of our choosing. This involved having to isolate the audio from the monologue from the soundtrack of the film, and for my project personally, isolating the vocals and removing them from my song of choice. Then we were tasked with editing clips in the time and beat of the audio as shown above and I also chose again to add captions and reuse my previously learned typography skills.</figcaption>
    </figure>
