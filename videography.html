      <figcaption>I have worked for Open Ear for 3 years now as an Operations Manager and this video captured my time there. I really enjoy putting together compilations similar to this one, with no soundtrack, that just focuses on small, intimate moments and fun memories. It's like looking through a photo album but the photos are briefly alive. I put a compilation together like this every month just for my own personal keeping and for my love of videography.</figcaption>
